# Continuous integration for the Prospect Book.
#
# Three jobs, three different questions:
#   test       Does the repository agree with itself?  npm test — every *_test.ts plus the
#              sync check plus scripts/conformance_test.ts (the ledger vs the code).
#   reconcile  Does the record agree with the RUNNING system?  scripts/reconcile.ts calls
#              pb_reconcile_state() — aggregates only, callable with the page's own publishable
#              key, so this job needs NO secrets and also runs every six hours, because the
#              database can drift without anyone pushing (that is how it drifted the first time).
#   deploy     Deploy the functions a PERSON names, each as a one-line entrypoint pinned to this
#              commit (RUNBOOK §3), so the deployed function IS the commit. Manual only: started from
#              the Actions tab with the `functions` input, never on a push. It refuses a commit that
#              is not on the default branch and refuses to run without SUPABASE_ACCESS_TOKEN.
#              Until 2 Oct 2026 this job deployed five functions from source on every push to the
#              default branch, which would have redeployed whatever main held over production the
#              day the token was set (DECISIONS §63; it replaces §28's push-to-deploy).
#
# The page publish stays in deploy-pages.yml (manual). Nothing here touches web/.

name: Prospect Book CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      functions:
        description: "Edge functions to deploy, space-separated, pinned to this commit (empty: deploy nothing)"
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repo agrees with itself (npm test)
    # Runs on the schedule too (23 Sep 2026): it needs no secrets, and a green scheduled run that
    # only reconciled is how two nights of a notes sweep that did no work went unseen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  reconcile:
    name: Record agrees with the running system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: reconcile declared vs running
        run: node --experimental-strip-types scripts/reconcile.ts

  deploy:
    name: Deploy named functions, pinned to this commit (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.functions != ''
    needs: [test, reconcile]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sgagrmapuovnjwvgsxbp
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse without the token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN is not set as a repository secret; nothing was deployed."
          exit 1
      - name: Refuse a commit that is not on the default branch
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_SHA is not on the default branch; a deployed function must be a commit main carries."
            exit 1; }
      - name: Deploy each function as a one-line entrypoint pinned to this commit
        run: |
          set -euo pipefail
          allowed=" pb-score pb-sync pb-notes pb-verify pb-fathom-webhook pb-pipedrive-webhook "
          for fn in $FUNCTIONS; do
            case "$allowed" in *" $fn "*) ;; *) echo "::error::unknown function: $fn"; exit 1 ;; esac
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/supabase/functions/${fn}/index.ts"
            # Pre-flight (RUNBOOK §3): the raw URL must serve exactly the committed file.
            curl -fsS "$url" -o "/tmp/${fn}.ts"
            cmp "/tmp/${fn}.ts" "supabase/functions/${fn}/index.ts"
            mkdir -p "pinned/supabase/functions/${fn}"
            printf '// Deployed by CI from commit %s: the deployed function IS this commit (RUNBOOK §3).\nimport "%s";\n' \
              "$GITHUB_SHA" "$url" > "pinned/supabase/functions/${fn}/index.ts"
            npx --yes supabase@latest functions deploy "$fn" --project-ref "$PROJECT_REF" \
              --no-verify-jwt --use-api --workdir pinned
            echo "::notice::${fn} deployed, pinned to ${GITHUB_SHA}, verify_jwt false"
          done
